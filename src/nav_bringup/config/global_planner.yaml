# global_planner 统一参数。
# 文件内容从示例工程的静态地图规划参数收敛而来，所有机器相关路径通过 launch 参数传入。

pcl_publisher:
  ros__parameters:
    global_frame: "map"
    map_rotate_around_x: 0.0
    map_rotate_around_y: 0.0
    map_rotate_around_z: 0.0
    map_translate_x: 0.0
    map_translate_y: 0.0
    map_translate_z: 0.0
    ground_rotate_around_x: 0.0
    ground_rotate_around_y: 0.0
    ground_rotate_around_z: 0.0
    ground_translate_x: 0.0
    ground_translate_y: 0.0
    ground_translate_z: 0.0
    map_down_sample: 0.2
    ground_down_sample: 0.3
    planground_down_sample: 0.1
    max_input_bytes: 67108864
    max_input_points: 4000000

perception_3d_global:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_footprint"
    max_obstacle_distance: 9999.0
    # Humanoid robot footprint modeled as a single 0.27m radius cylinder.
    inscribed_radius: 0.27
    inflation_descending_rate: 2.0
    inflation_radius: 1.5
    sensors_collected_frequency: 5.0
    plugins: ["map"]
    map:
      plugin: "perception_3d::StaticLayer"
      use_adaptive_connection: true
      adaptive_connection_number: 20
      radius_of_ground_connection: 4.1
      intensity_search_radius: 1.0
      intensity_search_punish_weight: 0.5
      static_imposing_radius: 0.2
      map_topic: "mapcloud"
      ground_topic: "mapground"
      support:
        mapping_mode: false
        enable_edge_detection: true
        generate_static_graph: false

global_planner:
  ros__parameters:
    turning_weight: 0.8
    goal_directness_weight: 0.6
    enable_detail_log: false
    # 与 0.15m hybrid voxel 和 0.3m ground voxel 匹配；0.05m 会让
    # 距离地图约 0.18m 的 B2 起点成为孤立点，导致目标已收到却无全局路径。
    a_star_expanding_radius: 0.2
    path_smoothing_resolution: 0.1
    path_smoothing_iterations: 5
    path_smoothing_data_weight: 0.20
    path_smoothing_smooth_weight: 0.40
    path_smoothing_max_deviation: 0.20
    use_pre_graph: false
    roi_file_path: ""
    roi_radius: 1.0
    roi_z_tolerance: 0.2

    planground_search_radius: 0.2
    planground_fallback_ratio: 0.3
    planground_downsample_leaf_size: 0.2

    use_hybrid_planner: true
    # Shortest-path first: planground is only a soft preference, not a lane.
    hybrid_planground_bias: 0.03
    hybrid_downsample_leaf_size: 0.15
    hybrid_max_ground_bridge_length: 20.0
    hybrid_max_ground_cost: 0.2
    hybrid_min_ground_cost: 0.0
    hybrid_detour_ratio_threshold: 1.0
    hybrid_distance_balance_threshold: 20.0
    hybrid_ground_path_length_penalty: 0.0
    hybrid_detour_balance_factor_lower_bound: 0.05
    hybrid_detour_balance_factor_upper_bound: 1.05
    hybrid_planground_exit_penalty: 0.0
    hybrid_ground_step_penalty: 0.0
    anti_backtrack_weight: 1.0
    hybrid_path_detour_limit: 1.15
    hybrid_planground_path_margin: 1.0

    hybrid_edge_penalty_radius: 0.1
    hybrid_edge_penalty_weight: 0.5
    hybrid_edge_penalty_falloff_rate: 2.0
