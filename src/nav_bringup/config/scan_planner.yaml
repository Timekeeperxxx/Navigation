# SCAN-Planner integration defaults for the Navigation workspace.
# Global path generation still comes from nav_planner using ground.pcd + footprint_fill.pcd.
# SCAN consumes /global_path as /initial_path and optimizes local B-spline trajectories
# against the live occupancy grid built from /lio/cloud_world.

scan_planner_node:
  ros__parameters:
    body_pose_topic: "/scan/body_pose"
    replan_request_topic: "/nav/replan_request"

    "fsm/navi_mode": 3
    "fsm/thresh_replan": 0.5
    "fsm/thresh_no_replan": 0.1
    # Keep the local target comfortably inside the 10x10m sliding map.  A 5m
    # target sat on the map boundary and was frequently classified as unknown.
    "fsm/planning_horizon": 3.0
    # Lift only the geometric SCAN planning start above base_footprint.  The
    # B2 controller remains planar and never commands linear.z.
    "fsm/start_height_offset": 0.30
    # A completed local lookahead is not the final destination.  Hand the last
    # spline to the terminal pose controller only after the body is genuinely
    # close; 0.50m made SCAN clear the goal visibly early on the real B2.
    "fsm/final_goal_tolerance": 0.20
    "fsm/emergency_time_": 1.0
    "fsm/emergency_min_stop_duration": 0.5
    "fsm/emergency_replan_period": 1.0
    "fsm/fail_safe": true
    "fsm/max_replan_fail_count": 1000
    "fsm/is_real_world": true

    "grid_map/frame_id": "map"
    "grid_map/sliding_map_frame_id": "sliding_map"
    "grid_map/sensor_type": "lidar"
    "grid_map/cloud_is_world": true
    "grid_map/need_extrinsic": false
    # Keep only the physical Mid-360 blind range here.  A pose-aware B2 body
    # mask removes self returns without hiding a nearby external obstacle.
    "grid_map/lidar_min_range": 0.10
    "grid_map/self_filter_enabled": true
    "grid_map/self_filter_radius": 0.27
    "grid_map/self_filter_padding": 0.0
    "grid_map/self_filter_z_min_offset": -0.15
    "grid_map/self_filter_z_max_above_sensor": 0.05
    "grid_map/resolution": 0.03
    "grid_map/sliding_map_size_x": 10.0
    "grid_map/sliding_map_size_y": 10.0
    "grid_map/sliding_map_size_z": 3.0
    "grid_map/local_update_range_x": 4.0
    "grid_map/local_update_range_y": 4.0
    "grid_map/local_update_range_z": 1.0
    "grid_map/map_sliding_en": true
    "grid_map/map_sliding_thresh": 0.2
    # Unitree B2 footprint: two overlapping cylinders around base_footprint.
    "grid_map/body_height": 0.32
    "grid_map/double_cylinder_radius": 0.27
    # /grid_map/occupancy_inflate horizontal obstacle expansion. Keep this
    # separate from the robot footprint radius above.
    "grid_map/obstacles_inflation_radius": 0.20
    "grid_map/double_cylinder_offset": 0.205
    "grid_map/double_cylinder_center_offset": 0.0
    # SCAN queries collision at ground + body_height. With the 0.03m voxel
    # resolution this 0.05m setting expands upward by two cells (about 0.06m).
    # Together with the 0.05m downward trajectory probe, the minimum effective
    # obstacle height is about 0.20m.
    "grid_map/obstacles_inflation_z_up": 0.05
    "grid_map/obstacles_inflation_z_down": 0.45
    "grid_map/ground_height": 0.0
    "grid_map/cx": 317.19183349609375
    "grid_map/cy": 256.4806823730469
    "grid_map/fx": 609.5884399414062
    "grid_map/fy": 609.22021484375
    "grid_map/depth_filter_maxdist": 3.0
    "grid_map/depth_filter_mindist": 0.3
    "grid_map/depth_filter_margin": 1
    "grid_map/k_depth_scaling_factor": 1000.0
    "grid_map/skip_pixel": 2
    "grid_map/p_hit": 0.85
    "grid_map/p_miss": 0.30
    "grid_map/p_min": 0.12
    "grid_map/p_max": 0.98
    "grid_map/p_occ": 0.80
    "grid_map/max_ray_length": 3.5
    # Lidar point clouds contain hits but not explicit max-range free rays.
    # Decay local occupied voxels that are not hit/traversed in the current
    # scan. Keep decay conservative so short cloud/TF jitter does not clear
    # dynamic obstacles before avoidance can replan around them.
    "grid_map/occupancy_decay_enabled": true
    "grid_map/occupancy_decay_miss_scale": 0.5
    "grid_map/occupancy_decay_period": 1
    "grid_map/vis_height": 0.3
    "grid_map/show_occ_time": false
    "grid_map/timing_log_enabled": true
    "grid_map/timing_log_period": 1.0
    "grid_map/publish_inflate_sparse": true
    "grid_map/inflate_sparse_leaf_size": 0.15
    "grid_map/inflate_sparse_topic": "/grid_map/occupancy_inflate_sparse"

    "manager/max_vel": 0.22
    "manager/max_acc": 0.50
    "manager/max_jerk": 4.0
    "manager/control_points_distance": 0.30
    "manager/feasibility_tolerance": 0.5
    "manager/planning_horizon": 3.0
    # Check a small corridor around the published trajectory.  The inflated
    # obstacle cloud can sit below the lifted SCAN body path, so use the same
    # vertical tolerance as dynamic_avoidance_monitor.
    "manager/collision_check_corridor_radius": 0.01
    "manager/collision_check_z_tolerance": 0.45
    "manager/collision_check_z_tolerance_down": 0.05
    "manager/collision_check_z_tolerance_up": 0.45
    # Ignore occupied samples close to the trajectory start.  The corridor
    # checker samples laterally up to 0.40m, so this must be larger than the
    # corridor radius to avoid rejecting a new trajectory at t=0 because of
    # robot/self-filter or stale local-map points near the current pose.
    "manager/collision_check_start_clear_radius": 0.10

    "optimization/lambda_smooth": 1.0
    "optimization/lambda_collision": 1.5
    "optimization/lambda_feasibility": 0.1
    "optimization/lambda_fitness": 0.5
    "optimization/dist0": 0.55
    "optimization/max_vel": 0.22
    "optimization/vel_tolerance": 1.0
    "optimization/max_acc": 0.50
    "optimization/acc_tolerance": 1.5

closed_loop_controller:
  ros__parameters:
    body_pose_topic: "/scan/body_pose"
    execution_path_topic: "/scan/execution_path"
    execution_path_frame: "map"
    safety_execution_frozen_topic: "/planning/safety_execution_frozen"
    safety_speed_scale_topic: "/planning/safety_speed_scale"
    # dynamic_avoidance_monitor is the final /cmd_vel_safe gateway and applies
    # this scale there. Applying it again inside the controller squares 0.35
    # into 0.1225 and drops B2 below its continuous walking speed.
    apply_safety_speed_scale_in_controller: false
    controller_reset_topic: "/planning/controller_reset"
    goal_position_topic: "/clicked_point"
    task_start_reset_topics:
      - "/nav_start"
      - "/scheduled_task_start"
      - "/patrol_task_start"
    safety_speed_scale_timeout: 1.0
    execution_path_publish_period: 0.10
    execution_path_sample_dt: 0.25
    time_forward: 1.0
    # Hold linear velocity at zero until the body is roughly aligned with the
    # trajectory heading.  This avoids walking sideways when the lookahead
    # target changes around an obstacle.
    heading_error_threshold: 0.5
    # Remain in heading alignment until both the error and measured body yaw
    # rate settle.  This Schmitt band prevents rotate/walk chatter at 0.5 rad.
    heading_resume_threshold: 0.35
    kp_pos: 0.8
    kp_yaw: 1.5
    # Compensate the delayed B2 yaw response using pose-derived angular rate.
    # If a correction would reverse while the body is still turning, command
    # zero first instead of immediately applying the opposite saturated yaw.
    yaw_prediction_horizon: 1.0
    yaw_rate_filter_time_constant: 0.15
    yaw_rate_settle_threshold: 0.06
    yaw_reversal_neutral_time: 0.35
    desired_yaw_filter_time_constant: 0.20
    maximum_measured_yaw_rate: 2.0
    # B2 navigation limits. Dynamic avoidance may only scale these down.
    max_vx: 0.35
    max_vy: 0.08
    max_vyaw: 0.45
    # Unitree B2 ignores very small Move() commands even when the SDK returns
    # success. Keep the pre-safety command above its effective walking floor;
    # dynamic avoidance remains downstream and can still scale or stop it.
    min_translation_speed: 0.15
    # min_translation_speed already enforces the B2 walking floor in world
    # velocity. Do not turn a near-zero body-forward solution into an
    # artificial 0.15 m/s surge after every short SCAN replan.
    min_forward_x_speed: 0.0
    # Ordinary path tracking must approach by turning and walking forward.
    # Reverse remains reserved for an explicit, separately validated recovery.
    allow_reverse: false
    finish_dist: 0.10
    enable_final_yaw: true
    # The terminal controller holds XY while aligning yaw.  A small bounded
    # reverse is allowed only here so turning drift can be corrected without
    # reopening the full SCAN goal.
    final_yaw_start_dist: 0.20
    final_position_tolerance: 0.12
    final_position_kp: 0.8
    final_position_max_vx: 0.10
    final_position_max_vy: 0.06
    final_position_allow_reverse: true
    # Keep this identical to waypoint_progress_monitor reach_tolerance_yaw so
    # the controller cannot stop turning before any task waypoint is complete.
    final_yaw_tolerance: 0.10
    final_yaw_kp: 0.6
    # B2 实机对过小角速度没有动作；终点误差未达标时保持有效转向速度。
    final_yaw_min_vyaw: 0.25
    final_yaw_max_vyaw: 0.30
    # Do not abort a large turn merely because a fixed wall-clock budget
    # expired.  Do not clear the active route on a yaw dead-zone: the effective
    # minimum angular speed above is responsible for continuing alignment.
    final_yaw_timeout: 0.0
    final_yaw_progress_timeout: 0.0
    final_yaw_progress_epsilon: 0.05
    final_yaw_reversal_hold_time: 0.35
    final_yaw_reversal_hold_speed_scale: 0.35
    final_yaw_timeout_mark_reached: false
    approach_slowdown_dist: 1.5
    approach_min_speed_scale: 0.50
