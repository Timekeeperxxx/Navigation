# RViz-only planner tuning for dense offline PCD maps.
# The normal navigation entry keeps using global_planner.yaml.

pcl_publisher:
  ros__parameters:
    global_frame: "map"
    map_rotate_around_x: 0.0
    map_rotate_around_y: 0.0
    map_rotate_around_z: 0.0
    map_translate_x: 0.0
    map_translate_y: 0.0
    map_translate_z: 0.0
    ground_rotate_around_x: 0.0
    ground_rotate_around_y: 0.0
    ground_rotate_around_z: 0.0
    ground_translate_x: 0.0
    ground_translate_y: 0.0
    ground_translate_z: 0.0
    map_down_sample: 0.2
    ground_down_sample: 0.1
    planground_down_sample: 0.1
    planground_bridge_enabled: true
    planground_bridge_neighbor_radius: 0.2
    planground_bridge_max_gap: 0.35
    planground_bridge_point_spacing: 0.05
    planground_bridge_min_component_points: 20
    planground_bridge_max_bridges: 64

perception_3d_global:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_footprint"
    max_obstacle_distance: 9999.0
    inscribed_radius: 0.1
    inflation_descending_rate: 2.0
    inflation_radius: 1.5
    sensors_collected_frequency: 1.0
    plugins: ["map"]
    map:
      plugin: "perception_3d::StaticLayer"
      use_adaptive_connection: true
      adaptive_connection_number: 20
      radius_of_ground_connection: 4.1
      intensity_search_radius: 1.0
      intensity_search_punish_weight: 0.5
      static_imposing_radius: 0.2
      map_topic: "mapcloud"
      ground_topic: "mapground"
      support:
        mapping_mode: false
        # Ground/fill is the global traversability contract. Skip the unused
        # static dGraph so large offline scenes become ready promptly.
        enable_edge_detection: false
        generate_static_graph: false

global_planner:
  ros__parameters:
    turning_weight: 0.1
    enable_detail_log: false
    a_star_expanding_radius: 0.2
    use_pre_graph: false
    roi_file_path: ""
    roi_radius: 1.0
    roi_z_tolerance: 0.2

    planground_search_radius: 0.2
    planground_fallback_ratio: 0.3
    planground_downsample_leaf_size: 0.2
    rviz_goal_ground_snap_enabled: true
    rviz_goal_ground_snap_xy_radius: 0.50
    rviz_goal_ground_snap_max_layer_distance: 0.75
    rviz_goal_ground_snap_xy_layer_tie_distance: 0.15
    rviz_goal_unspecified_z_tolerance: 0.001

    use_hybrid_planner: true
    hybrid_planground_bias: 15.0
    hybrid_downsample_leaf_size: 0.20
    hybrid_reference_planning_time: 2.0
    # No arbitrary failure deadline; a newer goal still preempts immediately.
    hybrid_max_planning_time: 0.0
    hybrid_heuristic_weight: 300.0
    hybrid_max_ground_bridge_length: 0.25
    hybrid_max_ground_cost: 250.0
    hybrid_min_ground_cost: 150.0
    hybrid_detour_ratio_threshold: 4.0
    hybrid_distance_balance_threshold: 1.5
    hybrid_ground_path_length_penalty: 5.0
    hybrid_detour_balance_factor_lower_bound: 0.5
    hybrid_detour_balance_factor_upper_bound: 3.0

    hybrid_edge_penalty_radius: 0.1
    hybrid_edge_penalty_weight: 200.0
    hybrid_edge_penalty_falloff_rate: 2.0

    # Global planning is the sole /mapground safety authority.
    global_ground_support_enabled: true
    global_ground_support_edge_step: 0.05
    global_ground_support_turn_validation_enabled: true
    global_ground_support_turn_angle_step: 0.0872664626
    global_ground_support_turn_min_angle: 0.0
    global_ground_support_bucket_size: 0.15
    # 0.15 m matching radius + 5 mm voxel-centroid/numeric boundary allowance.
    global_ground_support_xy_tolerance: 0.155
    global_ground_support_z_tolerance: 0.20
    global_ground_support_planning_height: 0.32
    global_ground_support_circle_radius: 0.27
    global_ground_support_circle_offset: 0.205
    global_ground_support_circle_center_offset: -0.425
    global_ground_support_footprint_probe_margin: 0.19
    global_ground_support_perimeter_samples: 16
    global_ground_support_radial_samples: 2
    # Sparse-map tolerance only: each circle centre and inner ring stay strict.
    global_ground_support_outer_ring_max_missing_per_circle: 3
    global_start_maneuver_max_forward_distance: 2.0
    global_start_maneuver_forward_step: 0.05
    global_start_maneuver_path_sample_step: 0.05
    global_start_maneuver_yaw_sample_step: 0.0872664626
    global_start_maneuver_max_join_distance: 12.0
    # Route edges/turns were already checked by Hybrid A*. Avoid treating
    # every raw polyline vertex as a mandatory in-place rotation.
    global_delegate_pose_safety_to_local_planner: true
