# 动态避障与轻量路径跟随参数。
# 默认适配“没有连接雷达”的本地验证：不强制要求 `/nav/local_obstacles` 持续输入。

dynamic_avoidance_monitor:
  ros__parameters:
    enabled: true
    global_frame: "map"
    robot_frame: "base_footprint"
    global_path_topic: "/global_path"
    scan_execution_path_topic: "/scan/execution_path"
    # The controller republishes the remaining B-spline every 0.1 s.  A short
    # timeout makes loss of that stream fall back to the conservative global path.
    scan_execution_path_timeout: 2.0
    scan_execution_path_global_tolerance: 1.0
    obstacle_topic: "/grid_map/occupancy_inflate"
    # Monitor the fused LiDAR output itself.  GridMap can keep republishing an
    # old occupancy cloud after LiDAR/IMU input has stopped.
    sensor_heartbeat_topic: "/lio/cloud_world"
    status_topic: "/nav/obstacle_status"
    replan_request_topic: "/nav/replan_request"
    prune_plan_topic: "/prune_plan"
    local_path_topic: "/nav/local_path"
    cmd_vel_in_topic: "/cmd_vel"
    cmd_vel_safe_topic: "/cmd_vel_safe"
    safety_execution_frozen_topic: "/planning/safety_execution_frozen"
    nav_start_topic: "/nav_start"
    nav_stop_topic: "/nav_stop"

    lookahead_distance: 2.0
    backward_prune_distance: 0.5
    path_deviation_tolerance: 1.0
    # /grid_map/occupancy_inflate already contains the 0.27 m physical radius.
    # This 0.04 m half-diagonal check matches a path position to the centre of
    # its 0.05 m occupied voxel without double-inflating the physical body.
    path_corridor_radius: 0.04
    # Match SCAN's front/rear circle centres relative to base_footprint.
    footprint_center_offsets: [-0.22, -0.63]
    footprint_sweep_max_step: 0.05
    footprint_sweep_max_yaw_step: 0.0872664626
    # The SCAN path is at the lifted body planning height.  Keep floor voxels
    # below it out of the independent 2D safety check (downward tolerance).
    z_tolerance: 0.10
    # Upward the check must cover the whole machine, not just the body slice:
    # the Mid360 mast tops out near 0.97 m while the path sits at 0.30 m.
    # Voxels are already inflated 0.33 m downwards, so 0.45 m above the path
    # catches overhangs (table edges, shelf beams, door crossbars) whose
    # physical bottom is below about 1.08 m; higher clearance passes.
    z_tolerance_up: 0.45
    # Distances are measured from the B2 body centre.  Ignore points inside
    # the robot envelope, then retain a 0.35 m stopping margin outside it.
    # SCAN occupancy inflation expands B2 body/leg returns to about 0.80 m.
    # Clear that self-envelope while keeping a 0.30 m external stop margin.
    # Body returns are removed upstream by GridMap's pose-aware self mask.
    # Ignore only two local voxels of discretization noise; a larger blind
    # radius can hide an inner-corner wall after footprint inflation.
    robot_self_clear_radius: 0.10
    stop_distance: 1.20
    slow_distance: 1.80
    replan_blocked_duration: 2.0
    # Once a persistent block requests replanning, do not release the old
    # trajectory on a single flickering-clear point cloud frame.  Require a
    # newer SCAN generation and 2.0 s of continuous clearance.
    blocked_clear_duration: 2.0
    # A one-frame collision prediction that clears before a replan was needed
    # uses four LiDAR frames of confirmation.  Reusing the 2 s replan handoff
    # delay for every transient footprint-edge flicker made narrow bypasses
    # advance only a few centimetres at a time.
    transient_clear_duration: 0.4
    # A hard stop can otherwise deadlock when the current footprint is already
    # on a voxel boundary.  Permit only a short, monotonic-clearance escape
    # trajectory and keep it at the B2's effective 0.15 m/s walking floor.
    allow_clearance_escape: true
    clearance_escape_max_distance: 0.60
    clearance_escape_max_drop: 0.015
    clearance_escape_min_improvement: 0.02
    clearance_escape_speed_scale: 0.60
    # Livox/grid-map updates can have ~0.7 s gaps under Jetson load.
    sensor_timeout: 1.5
    check_period_sec: 0.2
    # At 0.15 m/s, 0.3 s is 4.5 cm of travel; the 1.2 m stop envelope remains
    # conservative while avoiding Python callback starvation on Jetson.
    obstacle_processing_period_sec: 0.3
    max_obstacle_points: 4000
    slow_speed_scale: 0.70
    # This topic is already footprint-inflated.  Nearby points outside the
    # execution corridor include the robot's own 0.90 m inflation boundary;
    # only path-relevant points should reduce navigation speed.
    slow_nearby_obstacles: false

    require_obstacle_stream: true
    allow_path_start_without_tf: false
    enable_cmd_vel_filter: true
    # Keep the independent hard-stop layer enabled.  Self-occupancy must be
    # fixed at the grid/footprint source; bypassing this check is unsafe.
    enforce_path_blocking: true
    require_nav_start: true
    publish_zero_on_stop: true
    publish_prune_plan: true
    replan_publish_period: 1.0

nav_path_follower:
  ros__parameters:
    global_frame: "map"
    robot_frame: "base_footprint"
    path_topic: "/nav/local_path"
    fallback_path_topic: "/global_path"
    obstacle_status_topic: "/nav/obstacle_status"
    nav_start_topic: "/nav_start"
    nav_stop_topic: "/nav_stop"
    cmd_vel_topic: "/cmd_vel"
    nav_status_topic: "/nav_status"

    require_nav_start: true
    control_period_sec: 0.1
    path_timeout_sec: 2.0
    status_timeout_sec: 1.0
    lookahead_distance: 0.8
    goal_tolerance: 0.25
    path_deviation_tolerance: 1.2
    linear_slow_radius: 1.0
    max_linear_speed: 0.25
    max_angular_speed: 0.7
    yaw_gain: 1.5
    heading_only_angle: 0.9
    caution_speed_scale: 0.35
    publish_zero_when_idle: true

local_obstacle_simulator:
  ros__parameters:
    frame_id: "map"
    obstacle_topic: "/nav/local_obstacles"
    clicked_obstacle_topic: "/nav/sim_obstacle_point"
    clear_topic: "/nav/clear_sim_obstacles"
    initial_obstacles_json: "[]"
    publish_period_sec: 0.2
    obstacle_lifetime_sec: 0.0
    # RViz Publish Point 落在地面上；扩展成有宽度和高度的软障碍柱，
    # 才会覆盖 SCAN 位于约 0.30 m 的机身规划切片。
    cluster_radius: 0.12
    cluster_points: 12
    obstacle_height: 0.70
    vertical_step: 0.10
