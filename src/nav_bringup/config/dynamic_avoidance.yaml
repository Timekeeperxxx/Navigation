# 动态避障与轻量路径跟随参数。
# 默认适配“没有连接雷达”的本地验证：不强制要求 `/nav/local_obstacles` 持续输入。

dynamic_avoidance_monitor:
  ros__parameters:
    enabled: true
    global_frame: "map"
    robot_frame: "base_footprint"
    global_path_topic: "/global_path"
    scan_execution_path_topic: "/scan/execution_path"
    # The controller republishes the remaining B-spline every 0.1 s.  A short
    # timeout makes loss of that stream fall back to the conservative global path.
    scan_execution_path_timeout: 2.0
    scan_execution_path_global_tolerance: 1.0
    # /global_path lies on the terrain surface, while SCAN trajectories are at
    # body planning height. Lift only the safety fallback so ground voxels are
    # not mistaken for obstacles when the execution-path stream is late.
    global_path_height_offset: 0.30
    # Direct 10 Hz fused LiDAR cloud. The sparse inflated map is generated by
    # SCAN itself at about 1 Hz and disappears completely if SCAN is busy, so
    # it cannot provide a prompt, independent emergency response.
    obstacle_topic: "/lio/cloud_world"
    status_topic: "/nav/obstacle_status"
    replan_request_topic: "/nav/replan_request"
    prune_plan_topic: "/prune_plan"
    local_path_topic: "/nav/local_path"
    cmd_vel_in_topic: "/cmd_vel"
    cmd_vel_safe_topic: "/cmd_vel_safe"
    safety_execution_frozen_topic: "/planning/safety_execution_frozen"
    safety_speed_scale_topic: "/planning/safety_speed_scale"
    nav_start_topic: "/nav_start"
    nav_stop_topic: "/nav_stop"

    lookahead_distance: 4.0
    backward_prune_distance: 0.5
    # Startup heading correction can leave the robot offset from the freshly
    # published SCAN execution path.  Keep matching stable so blockers are still
    # evaluated instead of flipping to deviated/pass.
    path_deviation_tolerance: 1.5
    # Raw LiDAR is not footprint-inflated. Include the B2 collision radius plus
    # a small tracking margin while still evaluating only the active path.
    path_corridor_radius: 0.35
    # Check vertical blockers asymmetrically around the lifted SCAN body path:
    # 0.05m below excludes floor returns; 0.90m above catches a person's legs
    # and torso intersecting the B2 execution corridor.
    z_tolerance: 0.90
    z_tolerance_down: 0.05
    z_tolerance_up: 0.90
    # Live cloud probing on the B2 shows no returns within 0.45m of the body
    # centre. Keep only a 0.35m self mask so close external obstacles remain visible.
    robot_self_clear_radius: 0.35
    # Only a confirmed active-path blocker can trigger this stop; unrelated
    # side points do not. Stop first, then request a frozen-start SCAN replan.
    stop_distance: 1.0
    slow_distance: 0.90
    replan_blocked_duration: 0.10
    # Jetson 上 /grid_map/occupancy_inflate 会出现 1-2s 抖动；低于这个值会误判传感器丢失并急停。
    sensor_timeout: 3.0
    # 10Hz moves only 2.5cm at the configured 0.25m/s limit and leaves enough
    # CPU for SCAN and the lightweight execution-path callback on Jetson.
    check_period_sec: 0.10
    obstacle_processing_period_sec: 0.10
    # The fused cloud is about 5-7k points on this machine. Keep all points;
    # the path-distance calculation below is NumPy-vectorized.
    obstacle_voxel_leaf_size: 0.0
    max_obstacle_points: 8000
    slow_speed_scale: 0.35
    # Nearby points outside the active path corridor are often self/side returns
    # on the humanoid; only path blockers should affect avoidance.
    slow_nearby_obstacles: false

    # Do not freeze the robot only because the inflated obstacle cloud pauses.
    # Real blockers still stop through enforce_path_blocking when fresh points arrive.
    require_obstacle_stream: false
    allow_path_start_without_tf: false
    enable_cmd_vel_filter: true
    # Obstacle decisions are based only on whether points intersect the active
    # execution path. There is no independent front-sector proximity stop.
    enforce_path_blocking: true
    # Far path blockers slow down and replan; blockers within stop_distance
    # freeze immediately. This avoids stopping for a distant bypassable point.
    stop_on_path_blocked: false
    require_nav_start: false
    publish_zero_on_stop: true
    publish_prune_plan: true
    replan_publish_period: 0.10
    obstacle_timing_log_enabled: true
    obstacle_timing_log_period: 1.0
    safety_check_timing_log_enabled: true
    safety_check_timing_log_period: 1.0

nav_path_follower:
  ros__parameters:
    global_frame: "map"
    robot_frame: "base_footprint"
    path_topic: "/nav/local_path"
    fallback_path_topic: "/global_path"
    obstacle_status_topic: "/nav/obstacle_status"
    nav_start_topic: "/nav_start"
    nav_stop_topic: "/nav_stop"
    cmd_vel_topic: "/cmd_vel"
    nav_status_topic: "/nav_status"

    require_nav_start: false
    control_period_sec: 0.1
    path_timeout_sec: 2.0
    status_timeout_sec: 1.0
    lookahead_distance: 0.8
    goal_tolerance: 0.25
    path_deviation_tolerance: 1.2
    linear_slow_radius: 1.0
    max_linear_speed: 0.25
    max_angular_speed: 0.7
    yaw_gain: 1.5
    heading_only_angle: 0.9
    caution_speed_scale: 0.35
    publish_zero_when_idle: true

local_obstacle_simulator:
  ros__parameters:
    frame_id: "map"
    obstacle_topic: "/nav/local_obstacles"
    clicked_obstacle_topic: "/nav/sim_obstacle_point"
    clear_topic: "/nav/clear_sim_obstacles"
    initial_obstacles_json: "[]"
    publish_period_sec: 0.2
    obstacle_lifetime_sec: 0.0
    cylinder_radius: 0.35
    cylinder_height: 1.5
    xy_resolution: 0.10
    z_resolution: 0.20
    cluster_radius: 0.0
    cluster_points: 8
